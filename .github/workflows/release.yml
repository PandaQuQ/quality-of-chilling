name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download BepInEx references
        shell: pwsh
        run: |
          $version = "5.4.23.5"
          $url = "https://github.com/BepInEx/BepInEx/releases/download/v$version/BepInEx_win_x64_$version.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "bepinex.zip"
          $dest = Join-Path $env:RUNNER_TEMP "bepinex"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $dest -Force
          "BEPINEX_ROOT_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build weather module
        run: dotnet build src/QualityOfChilling.Weather/QualityOfChilling.Weather.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item artifacts/QualityOfChilling.Weather/RealTimeWeatherForChill.dll artifacts/release/RealTimeWeatherForChill.dll
          Compress-Archive -Path artifacts/release/RealTimeWeatherForChill.dll -DestinationPath artifacts/QualityOfChilling.Weather.zip -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/QualityOfChilling.Weather.zip
          generate_release_notes: true
