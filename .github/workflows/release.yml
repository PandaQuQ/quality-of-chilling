name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore private game references
        shell: pwsh
        run: |
          if (-not "${{ secrets.CHILL_GAME_REFS_ZIP_BASE64 }}") {
            throw "Missing CHILL_GAME_REFS_ZIP_BASE64 secret. See README.md for expected zip layout."
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "chill-game-refs.zip"
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String("${{ secrets.CHILL_GAME_REFS_ZIP_BASE64 }}"))
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP/chill-game" -Force
          "CHILL_GAME_DIR=$env:RUNNER_TEMP/chill-game" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build weather module
        run: dotnet build src/QualityOfChilling.Weather/QualityOfChilling.Weather.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item artifacts/QualityOfChilling.Weather/RealTimeWeatherForChill.dll artifacts/release/RealTimeWeatherForChill.dll
          Compress-Archive -Path artifacts/release/RealTimeWeatherForChill.dll -DestinationPath artifacts/QualityOfChilling.Weather.zip -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/QualityOfChilling.Weather.zip
          generate_release_notes: true
